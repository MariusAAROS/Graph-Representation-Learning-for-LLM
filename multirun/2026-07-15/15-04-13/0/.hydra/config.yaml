config_name: baseline
dataset:
  name: graphqa
  test_type: ood
  dataset_config: baseline
  ood_task:
  - CycleCheck
  - EdgeExistence
  - NodeCount
  - NodeDegree
  - EdgeCount
  - ConnectedNodes
  - DisconnectedNodes
  - Reachability
  - ShortestPath
  - TriangleCounting
  - MaximumFlow
  batch_size: 8
  n_examples: 5
  num_workers: 1
model:
  name: gpt2
  lr: 5.0e-05
  max_seq_len: 1024
  max_new_tokens: 50
  gradient_checkpointing: true
lora:
  enabled: false
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_modules:
  - c_attn
trainer:
  max_epochs: 10
  precision: bf16-mixed
  accelerator: auto
  checkpoint_monitor: val/exact_match
  checkpoint_mode: max
  early_stopping_monitor: val/exact_match
  early_stopping_patience: 3
  early_stopping_mode: max
  predictions_dir: predictions
  gradient_clip_val: 0
  val_check_interval: 1.0
  gradient_accumulation: 4
logger:
  project: Meta-ICL
  name: baseline
