# @package _global_

# Same family as the 1.5B reference, so the delta isolates the effect of scale.
# Inherits the reference batch/optimizer settings unchanged (~42GB on 80GB).

model:
  name: "Qwen/Qwen2.5-3B"

trainer:
  gradient_clip_val: 1.0        # unclipped bf16 training diverged at 7B; clip from 3B up
